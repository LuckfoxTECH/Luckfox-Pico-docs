name: Sync to Gitee

on:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'LuckfoxTECH/Luckfox-Pico-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository history
        shell: bash
        run: |
          set -euo pipefail

          # A bare clone preserves gitlinks without expanding submodules.
          # The official source repository is public.
          git clone --bare --quiet \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "$RUNNER_TEMP/pico-gitee-sync.git"

      - name: Sync main and tags
        shell: bash
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          GITEE_SSH_URL: git@gitee.com:LuckfoxTECH/Luckfox-Pico-docs.git
        run: |
          set -euo pipefail

          if [[ -z "$GITEE_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Add the GITEE_SSH_PRIVATE_KEY repository secret. See .github/GITEE_SYNC.md."
            exit 1
          fi

          umask 077
          ssh_dir="$RUNNER_TEMP/gitee-sync"
          sync_repo="$RUNNER_TEMP/pico-gitee-sync.git"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          ssh-keygen -y -P '' -f "$ssh_dir/id_ed25519" > /dev/null
          git --git-dir="$sync_repo" show \
            refs/heads/main:.github/gitee_known_hosts > "$ssh_dir/known_hosts"

          export GIT_SSH_COMMAND="ssh -F /dev/null \
            -i \"$ssh_dir/id_ed25519\" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=\"$ssh_dir/known_hosts\""

          # Keep existing Gitee history and tags if they diverge.
          if git --git-dir="$sync_repo" push "$GITEE_SSH_URL" \
              refs/heads/main:refs/heads/main; then
            echo "Gitee main synchronized."
          else
            push_status=$?
            echo "::error::Gitee rejected the main push. Check repository/branch write permissions and the Git error above."
            exit "$push_status"
          fi

          if git --git-dir="$sync_repo" show-ref --tags --quiet; then
            git --git-dir="$sync_repo" push "$GITEE_SSH_URL" \
              'refs/tags/*:refs/tags/*'
          fi

          {
            printf 'Synced main commit: `%s`\n\n' \
              "$(git --git-dir="$sync_repo" rev-parse refs/heads/main)"
            printf '[View the Gitee repository](https://gitee.com/LuckfoxTECH/Luckfox-Pico-docs)\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/gitee-sync/id_ed25519"
